name: Monitor TN and IA Grant Pages

on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run TN and IA grant page monitor
        run: node scripts/check-state-grants.mjs

      - name: Install Playwright and Chromium for nightly Iowa crawlers
        run: |
          npm install --no-save playwright @supabase/supabase-js
          npx playwright install --with-deps chromium

      - name: Run nightly Iowa grant crawlers and sync to site_grants
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-iowa-grants.mjs

      - name: Commit updated snapshot if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/state-watch-snapshot.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update TN and IA grant page snapshot"
            git push
          fi
