name: Monitor TN and IA Grant Pages

on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run TN and IA grant page monitor
        run: node scripts/check-state-grants.mjs

      - name: Install Playwright and Chromium for nightly Iowa crawlers
        run: |
          mkdir -p /tmp/grant-runner
          cd /tmp/grant-runner
          npm init -y
          for attempt in 1 2 3; do
            if npm install --no-package-lock --legacy-peer-deps --no-audit --no-fund playwright@1.65.1 @supabase/supabase-js@2.119.2; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to install pinned crawler dependencies after 3 attempts." >&2
              exit 1
            fi
            sleep 10
          done
          npx playwright install --with-deps chromium

      - name: Run nightly Iowa grant crawlers and sync to site_grants
        id: iowa-sync
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NODE_PATH: /tmp/grant-runner/node_modules
        run: node scripts/sync-iowa-grants.mjs

      - name: Sync minority and national grant directory
        id: national-sync
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NODE_PATH: /tmp/grant-runner/node_modules
        run: node scripts/sync-minority-and-national-grants.mjs

      - name: Commit updated snapshot if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for snapshot in .github/state-watch-snapshot.json .github/iowa-grants-snapshot.json; do
            if [ -f "$snapshot" ]; then git add "$snapshot"; fi
          done
          if ! git diff --staged --quiet; then
            git commit -m "chore: update TN and IA grant page snapshot"
            git push
          fi

      - name: Verify grant database sync
        if: always()
        env:
          IOWA_OUTCOME: ${{ steps.iowa-sync.outcome }}
          IOWA_SKIPPED: ${{ steps.iowa-sync.outputs.db_sync_skipped }}
          NATIONAL_OUTCOME: ${{ steps.national-sync.outcome }}
          NATIONAL_SKIPPED: ${{ steps.national-sync.outputs.db_sync_skipped }}
        run: |
          failed=0
          if [ "$IOWA_OUTCOME" != "success" ]; then
            echo "::error::Iowa grant database sync failed (outcome: $IOWA_OUTCOME)."
            failed=1
          elif [ "$IOWA_SKIPPED" = "true" ]; then
            echo "::error::Iowa snapshot was crawled, but database sync was skipped. Configure SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY as GitHub Actions secrets."
            failed=1
          fi
          if [ "$NATIONAL_OUTCOME" != "success" ]; then
            echo "::error::National grant directory sync failed (outcome: $NATIONAL_OUTCOME)."
            failed=1
          elif [ "$NATIONAL_SKIPPED" = "true" ]; then
            echo "::error::National grant database sync was skipped. Configure SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY as GitHub Actions secrets."
            failed=1
          fi
          exit "$failed"
